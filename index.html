<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Beer</title>
</head>

<body>
    <header>
        <img src="img/logo.png" alt="Logo Apéro Time" class="logo" style="width: 100px; height: 100px;">
    </header>
    <main>
        <input type="text" id="searchBar" placeholder="Rechercher une bière...">
        <div class="beer-list">

        </div>
        <div id="pagination-controles" class="flex justify-center mt-4">
            <button id="btn-precedent-top"
                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-l">
                Précédent
            </button>
            <div id="compteur-de-pages"
                class="text-center mt-4 mx-4 flex justify-center items-center flex-col border rounded-lg p-2">
                <span id="CompteurDePages" class="mx-4"></span>
            </div>
            <button id="btn-suivant-top" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-r">
                Suivant
            </button>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 La Brasserie Artisanale</p>
        <script src="script.js"></script>
    </footer>
</body>

</html>
