<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Beer</title>
</head>

<body>
    <header>
        <img src="img/logo.png" alt="Logo Apéro Time" class="logo" style="width: 100px; height: 100px;">
        <nav>
            <ul class="nav-links">
                <li><a href="./index.html">Accueil</a></li>
                <li><a href="./addBeer.html">Ajouter une bière</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <input type="text" id="searchBar" placeholder="Rechercher une bière...">
        <div class="beer-list">

        </div>
        <div id="pagination-controles" class="flex justify-center mt-4">
            <button id="btn-precedent-top"
                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-l">
                Précédent
            </button>
            <div id="compteur-de-pages"
                class="text-center mt-4 mx-4 flex justify-center items-center flex-col border rounded-lg p-2">
                <span id="CompteurDePages" class="mx-4"></span>
            </div>
            <div class="mx-2 flex items-center">
                <label for="pageSelect" class="mr-2">Aller à la page :</label>
                <select id="pageSelect" aria-label="Sélection de la page" class="border rounded p-1"></select>
            </div>
            <button id="btn-suivant-top" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-r">
                Suivant
            </button>
        </div>
    </main>

    <!-- Modal de détails -->
    <div id="beerModal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <button class="modal-close" aria-label="Fermer">&times;</button>
            <div class="modal-body">
                <img id="modalImage" src="" alt="" style="max-width:150px;height:auto;margin-bottom:1rem;" />
                <h2 id="modalName"></h2>
                <p id="modalTagline" style="font-style:italic;color:var(--muted);"></p>
                <p id="modalDescription"></p>
                <div id="modalMeta"
                    style="display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin-top:1rem;font-weight:700;">
                    <div><span class="accent">ABV</span><br /><span id="modalAbv"></span></div>
                    <div><span class="accent">IBU</span><br /><span id="modalIbu"></span></div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 La Brasserie Artisanale</p>
        <script>
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./workers.js')
                    .then(registration => {
                        console.log('Service Worker enregistré avec succès.', registration);
                    })
                    .catch(error => {
                        console.log("Erreur lors de l'enregistrement du Service Worker.", error);
                    });
            }
        </script>
        <script src="script.js"></script>
        <script src='indexDB.js'></script>
        <script src="modal.js"></script>
    </footer>
</body>

</html>
