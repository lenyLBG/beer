<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Add Beer</title>
</head>

<body>
    <header>
        <img src="img/logo.png" alt="Logo Apéro Time" class="logo" style="width: 100px; height: 100px;">
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="addBeer.html">Ajouter une bière</a></li>
            </ul>
    </header>
    <main>
        <h1>Ajouter une nouvelle bière</h1>
        <br>
        <form id="addBeerForm">
            <label for="beerName">Nom de la bière:</label>
            <input type="text" id="beerName" name="beerName" required>
            <br>
            <label for="beerType">Type de bière:</label>
            <input type="text" id="beerType" name="beerType" required>
            <br>
            <label for="beerABV">Teneur en alcool (%):</label>
            <input type="number" id="beerABV" name="beerABV" step="0.1" required>
            <br>
            <button type="submit">Ajouter la bière</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2024 La Brasserie Artisanale</p>
        <script src="script.js"></script>
    </footer>
</body>

</html>
