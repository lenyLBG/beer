<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Add Beer</title>
</head>

<body>
    <header>
        <img src="img/logo.png" alt="Logo Apéro Time" class="logo" style="width: 100px; height: 100px;">
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="addBeer.html">Ajouter une bière</a></li>
            </ul>
    </header>
    <main>
      <div class="container">
        <header class="page-header" style="display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem">
          <h1 style="margin:0">Ajouter une nouvelle bière</h1>
          <a href="index.html" class="btn-back" style="font-weight:700;color:var(--text);text-decoration:none;">← Retour à l'accueil</a>
        </header>

        <section class="add-beer-card card" style="padding:1rem;">
          <form id="beerForm" class="beer-form" style="display:grid;grid-template-columns:1fr 320px;gap:1.25rem;align-items:start;">

            <!-- Left: fields -->
            <div>
              <div class="form-row">
                <label for="beerName">Nom de la bière</label>
                <input type="text" id="beerName" name="beerName" required placeholder="Ex: IPA du Coin">
              </div>

              <div class="form-row">
                <label for="tagline">Accroche / Tagline</label>
                <input type="text" id="tagline" name="tagline" placeholder="Ex: L'IPA fruitée et houblonnée">
              </div>

              <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                <div>
                  <label for="alcoholContent">Teneur en alcool (% / ABV)</label>
                  <input type="number" id="alcoholContent" name="alcoholContent" step="0.1" required placeholder="Ex: 5.5">
                </div>
                <div>
                  <label for="ibu">IBU (amertume)</label>
                  <input type="number" id="ibu" name="ibu" step="1" placeholder="Ex: 40">
                </div>
              </div>

              <div class="form-row">
                <label for="description">Description (facultatif)</label>
                <textarea id="description" name="description" rows="4" placeholder="Aromes, notes, etc."></textarea>
              </div>

              <div class="form-row">
                <label for="beerImage">Image de la bière</label>
                <input type="file" id="beerImage" name="beerImage" accept="image/*">
              </div>

              <div style="display:flex;justify-content:center;margin:1rem 0;">
                <img id="previewImage" src="img/beer.jpg" alt="Aperçu de l'image" class="preview-image" style="max-width:100%;height:auto;" />
              </div>
            </div>

            <!-- Right: message -->
            <aside style="display:flex;flex-direction:column;gap:1rem;align-items:center;">
              <div id="formMessage" role="status" aria-live="polite" class="form-message" style="width:100%;text-align:center"></div>
            </aside>

            <!-- Buttons: full width bottom -->
            <div style="grid-column:1/-1;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:1rem">
              <button type="submit">Ajouter la bière</button>
              <a href="index.html" class="btn-precedent" role="button" style="display:inline-flex;align-items:center;justify-content:center;padding:.5rem 1rem;border-radius:8px;background:#fff;border:1px solid rgba(0,0,0,0.06);text-decoration:none;font-weight:700;color:var(--text);">Annuler</a>
            </div>

          </form>
        </section>
      </div>
    </main>
    <footer>
        <p>&copy; 2024 La Brasserie Artisanale</p>
        <script src='indexDB.js'></script>
        <script src="addBeer.js"></script>
    </footer>
</body>

</html>
